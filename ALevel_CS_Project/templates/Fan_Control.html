
{% extends "base2.html" %}
{% block title %}Fan Control{% endblock %}
{% block p1 %}Fan Control{% endblock %}
{% block p2 %}
    <form action="{{ url_for("fan_control_speed") }}" method="POST" >
        <p>Enter a fan speed</p>
        <label>
            <input type="number" name="fanspeed" placeholder="Enter fan speed"/>
        </label>
        <br>
        <input type="submit" value="Submit" /><br><br>
    </form>
    <form action="{{ url_for("fan_control_on") }}" method="POST">
        <input type="submit" name="fan_control" value="On">
    </form>

    <form action="{{ url_for("fan_control_off") }}" method="POST">
        <input type="submit" name="fan_control" value="Off">
    </form>
{% endblock %}
