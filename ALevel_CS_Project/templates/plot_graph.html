{% extends "base2.html" %}
{% block title %}Plot Graphs{% endblock %}
{% block p1 %}Plot Graphs{% endblock %}
{% block p2 %}
    <form action="{{ url_for("plot_graph") }}" method="POST" >
        <label for="runid">Select a RunID to plot a graph</label>
        <select id="runid" name="runid">
            {% for value in runid_values %}
                <option value="{{ value }}">{{ value }}</option>
            {% endfor %}
        </select>
        <br>
        <br>
        <input type="submit" value="Plot Graph" name="plot_graph">
    </form>

    <div class="plot_graph">
        <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js"></script>
        <canvas id="lineChart" width="700" height="500"></canvas>
        <script>
            var ctx = document.getElementById("lineChart").getContext("2d")
            var lineChart = new Chart(ctx, {
                type:"line",
                data: {
                    labels: {{ Time_graph | safe }},
                    datasets: [
                        {
                            label: "Actual Height",
                            data: {{ actual_height_graph | safe }},
                            fill: false,
                            borderColor: "rgb(255, 192, 75)",
                            lineTension: 0.1
                        },
                        {
                            label: "Target Height",
                            data: {{ target_height_graph | safe }},
                            fill: false,
                            borderColor: "rgb(0, 204, 0)",
                            lineTension: 0.1
                        },
                        {
                            label: "Upper Threshold",
                            data: {{ upper_thresh_graph | safe }},
                            fill: false,
                            borderColor: "rgb(28, 3, 250)",
                            lineTension: 0.1
                        },
                        {
                            label: "Lower Threshold",
                            data: {{ lower_thresh_graph | safe }},
                            fill: false,
                            borderColor: "rgb(255, 64, 56)",
                            lineTension: 0.1
                        },
                        {
                            label: "Fan Speed",
                            data: {{ fan_speed_graph | safe }},
                            fill: false,
                            borderColor: "rgb(255, 134, 56)",
                            lineTension: 0.1
                        },
                        {
                            label: "Proportional constant",
                            data: {{ p_constant_graph | safe }},
                            fill: true,
                            borderColor: "rgb(126,184,255)",
                            lineTension: 0.1
                        },
                        {
                            label: "Integral constant",
                            data: {{ i_constant_graph | safe }},
                            fill: true,
                            borderColor: "rgb(122,0,204)",
                            lineTension: 0.1
                        },
                        {
                            label: "Derivative constant",
                            data: {{ d_constant_graph | safe }},
                            fill: true,
                            borderColor: "rgb(248,106,237)",
                            lineTension: 0.1
                        },
                        {
                            label: "P term",
                            data: {{ p_term_graph | safe }},
                            fill: true,
                            borderColor: "rgb(213,244,121)",
                            lineTension: 0.1
                        },
                        {
                            label: "I term",
                            data: {{ i_term_graph | safe }},
                            fill: true,
                            borderColor: "rgb(140,153,228)",
                            lineTension: 0.1

                        },
                        {
                            label: "D term",
                            data: {{ d_term_graph | safe }},
                            fill: true,
                            borderColor: "rgb(115,117,205)",
                            lineTension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: false,
                    scales: {
                        xAxes: [{
                            scaleLabel: {
                                display: true,
                                labelString: 'Time',
                                fontColor: 'white'
                            }
                        }],
                        yAxes: [{
                            scaleLabel: {
                                display: true,
                                labelString: 'Height',
                                fontColor: 'white'
                            }
                        }]

                    }
                }
            })
        </script>
    </div>
{% endblock %}
