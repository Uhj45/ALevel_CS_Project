<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width initial-scale=1.0">
    <!--<meta http-equiv="refresh" content="2">-->
    <link rel= "stylesheet" type= "text/css" href= "static/style.css">

    <title>{% block title %}Remote Pi Hub{% endblock  %}</title>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <a href="/">Home</a>
        <a href="/oleddisplay">OLED Display</a>
        <a href="/pid">PID Controller</a>
    </div>

    <div class="content1">
        <div class="header">
            <p>{% block p %}This is my title!{% endblock %}</p>
        </div>
        <div class="content3">
            <div class="container">
                <div class="tile">LDR value is {{ LDR }}</div>
                <div class="tile">Temperature: {{ temp }}</div>
                <div class="tile">Humidity: {{ humidity }}</div>
                <div class="tile">four</div>
            </div>
            <div class="container">
                <div class="tile">one</div>
                <div class="tile">two</div>
                <div class="tile">three</div>
                <div class="tile">four</div>
            </div>
        </div>
        <div class="content4">
            <p>{% block p1 %}This is my sensor control.{% endblock %}</p>
        </div>
    </div>
</div>


{% block content %}{% endblock %}
</body>
</html>
