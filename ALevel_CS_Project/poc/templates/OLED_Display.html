
{% extends "base2.html" %}
{% block title %}OLED Display{% endblock %}
{% block p %}OLED Display{% endblock %}
{% block p1 %}
<label for="textInput">Enter a message to display</label>
<input type="text" id = "textInput"/>
<br>
<button id="submitButton" type="button" onclick="submitText()">Submit</button>
<p id="textOutput"></p>
<script>
    function submitText() {
        const text = document.getElementById("textInput").value
        document.getElementById("textOutput").innerHTML = "Message: " + text
    }
</script>

{% endblock %}
